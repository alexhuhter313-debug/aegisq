[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
[project]
name = "aegisq"
version = "2.1.0"
description = "Quantum-Ready AI Threat Detection Platform"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24.0","scikit-learn>=1.3.0","scipy>=1.11.0","pandas>=2.0.0","aiohttp>=3.9.0"]
[project.scripts]
aegisq = "aegisq.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
